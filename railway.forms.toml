# Railway config for MyFitCoach Forms (forms.myfitcoach.ie).
# In the Railway service settings, set "Config-as-code file path" to
# railway.forms.toml so this service does not pick up the portal's railway.toml.

[build]
builder = "nixpacks"
buildCommand = "cd forms && npm install"

[deploy]
startCommand = "node forms/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
