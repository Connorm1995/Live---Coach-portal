<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Weekly Check-In - MyFitCoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Dark Typeform-style theme. Variable names keep their portal meanings
     but are inverted for dark: --color-black = text, --color-white = background. */
  /* Readability pass, Aug 2026. Every element already passed WCAG AAA before
     this, so contrast was never the problem. Three things the standard does not
     measure were causing the eye strain, and all three are fixed here:

     1. TOO MUCH contrast. Pure #fff on pure #000 is 21:1, the maximum possible,
        and it causes halation - the light text blooms into the dark background.
        Astigmatism makes it markedly worse and astigmatism is common with age.
        WCAG sets a floor, not a ceiling, so this scored perfectly while being
        genuinely uncomfortable. Softened to off-white on near-black (~16:1).
     2. SATURATED COLOUR FOR READING. Teal was used for the 1-10 numerals, every
        answer option, and the client's own typed answers. The eye cannot focus
        cyan and a dark background at the same depth (chromatic aberration), so
        edges shimmer. Teal is now accent only: borders, fills, the brand, the
        progress bar. Anything you read or type is neutral.
     3. THIN STROKES. Typed answers were weight 300 in that saturated teal, the
        worst combination of the three. Nothing you read is below weight 400. */
  :root {
    --color-black: #E8EEED;   /* primary text - off-white, not pure white */
    --color-slate: #B4C0BE;   /* secondary text - solid, so contrast is predictable */
    --color-teal: #5CD6C8;    /* ACCENT ONLY - never body text or typed input */
    --color-teal-bright: #7ce3d7;
    --color-white: #0E1413;   /* background - near-black, not pure black */
    --color-off-white: #1b2624;
    --color-border: rgba(92, 214, 200, 0.5);
    --color-red: #ef4444;
    --color-amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* iOS inflates page text when the client has raised their system text size.
     That inflation used to push the 1-10 buttons off screen, and the first fix
     was to opt out of it with text-size-adjust: 100%. That has been REMOVED
     deliberately: these clients are largely older with weaker eyesight, and
     blocking their own text-size setting is the wrong trade for them.
     It is safe to allow because minmax(0, 1fr) + min-width: 0 on the scale
     buttons make the overflow structurally impossible at any font size - that
     is the fix that actually matters. Do not reintroduce text-size-adjust. */
  html, body {
    /* NOT height: 100% with overflow-y: auto. That pins the page to exactly one
       screen and makes body rather than the document the scroller, which strands
       anything taller than the screen. Letting the document flow normally is
       what allows a long question at a large text size to be scrolled to. */
    min-height: 100%;
    font-family: 'Roboto Slab', serif;
    background: var(--color-white);
    color: var(--color-black);
    overflow-x: hidden; /* horizontal only - vertical must stay available */
  }
  .checkin__progress {
    position: fixed; top: 0; left: 0; right: 0; height: 4px;
    background: var(--color-off-white); z-index: 10;
  }
  .checkin__progress-fill {
    height: 100%; width: 0%;
    background: var(--color-teal);
    transition: width 300ms ease;
  }
  .checkin__brand {
    position: fixed; top: 20px; left: 24px;
    font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
    color: var(--color-black); z-index: 10;
  }
  .checkin__brand span { color: var(--color-teal); }
  .checkin__save-status {
    position: fixed; top: 20px; right: 24px;
    font-size: 13px; color: var(--color-slate); z-index: 10;
    opacity: 0; transition: opacity 300ms ease;
  }
  .checkin__save-status--visible { opacity: 1; }
  .checkin__save-status--error { color: var(--color-amber); }
  .checkin__viewport {
    /* min-height, not height: with larger text the step can be taller than the
       screen and the page must be able to grow. position: relative contains the
       briefly-overlapping outgoing step so it cannot add phantom scroll. */
    /* svh is the viewport with the browser's own bars showing, so the step is
       never centred partly behind them on a phone. vh first as a fallback. */
    min-height: 100vh;
    min-height: 100svh;
    position: relative;
    display: flex; align-items: flex-start; justify-content: center;
    /* Top and bottom clear the fixed logo and the fixed up/down arrows. With
       32px, a question that filled a small phone (iPhone SE / 8 size) put its
       number against the logo and its last answer under the arrows, so a tap
       on that corner of the answer changed question instead of choosing it. */
    padding: 72px 40px 96px;
  }
  .checkin__step {
    max-width: 640px; width: 100%;
    opacity: 0; transform: translateY(28px);
    transition: opacity 320ms ease, transform 320ms ease;
    position: absolute; pointer-events: none;
  }
  .checkin__step--active {
    opacity: 1; transform: translateY(0);
    position: relative; pointer-events: auto;
    /* auto margins centre it while still allowing it to overflow downwards.
       align-items: center would clip the top of a too-tall step instead. */
    margin: auto 0;
  }
  .checkin__step--leaving-up { opacity: 0; transform: translateY(-28px); }
  .checkin__question-number {
    font-size: 15px; color: var(--color-teal); font-weight: 600;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .checkin__question-number svg { width: 12px; height: 12px; }
  .checkin__question {
    font-size: 28px; font-weight: 600; line-height: 1.32;
    letter-spacing: -0.005em; margin-bottom: 12px;
  }
  .checkin__hint {
    font-size: 17px; color: var(--color-slate);
    margin-bottom: 32px; line-height: 1.6;
    white-space: pre-line; /* hints may carry deliberate line breaks */
  }
  .checkin__scale {
    display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 8px; margin-bottom: 12px;
  }
  .checkin__scale-btn {
    /* minmax(0, 1fr) above and min-width: 0 here together stop a button's own
       contents from claiming more than its share of the row. Without both, a
       large enough font makes every column wider than the track and the whole
       grid overflows the screen. Do not drop either. */
    min-width: 0;
    aspect-ratio: 1 / 1.15;
    border: 1px solid var(--color-border); border-radius: 10px;
    background: rgba(92, 214, 200, 0.1);
    /* Numerals were 18px/500 in teal. Connor reported straining on the numbers
       specifically: small, thin, and cyan on a dark tinted fill. Now neutral,
       larger and heavier. The teal border and fill keep the look. */
    font-family: 'Roboto Slab', serif; font-size: 22px; font-weight: 600;
    color: var(--color-black); cursor: pointer;
    transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .checkin__scale-btn:hover { border-color: var(--color-teal); background: rgba(92, 214, 200, 0.12); }
  .checkin__scale-btn--selected {
    background: var(--color-teal); border-color: var(--color-teal); color: var(--color-white);
  }
  .checkin__scale-btn:focus-visible { outline: 2px solid var(--color-teal); outline-offset: 2px; }
  .checkin__scale-labels {
    display: flex; justify-content: space-between;
    font-size: 15px; color: var(--color-slate); margin-bottom: 24px;
  }
  .checkin__scale-label-mid { text-align: center; }
  .checkin__choices--multi { max-height: 52vh; overflow-y: auto; padding-right: 4px; }
  .checkin__section-heading {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--color-slate); font-weight: 600;
    margin: 16px 0 4px;
  }
  .checkin__other-input {
    width: 100%;
    border: none; border-bottom: 2px solid var(--color-border);
    font-family: 'Roboto Slab', serif; font-size: 18px; font-weight: 400;
    color: var(--color-black);
    padding: 8px 0; margin-top: 4px;
    background: transparent;
    transition: border-color 150ms ease;
  }
  .checkin__other-input:focus { outline: none; border-bottom-color: var(--color-teal); }
  .checkin__other-input::placeholder { color: #97A4A1; }
  .checkin__choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .checkin__choice {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border: 1px solid var(--color-border); border-radius: 10px;
    background: rgba(92, 214, 200, 0.1);
    font-family: 'Roboto Slab', serif; font-size: 18px; font-weight: 400;
    color: var(--color-black); line-height: 1.4;
    cursor: pointer; text-align: left;
    transition: background-color 150ms ease, border-color 150ms ease;
  }
  .checkin__choice:hover { border-color: var(--color-teal); background: rgba(92, 214, 200, 0.12); }
  .checkin__choice--selected { border-color: var(--color-teal); background: rgba(92, 214, 200, 0.12); }
  .checkin__choice:focus-visible { outline: 2px solid var(--color-teal); outline-offset: 2px; }
  .checkin__choice-key {
    width: 26px; height: 26px;
    border: 1px solid var(--color-border); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--color-slate);
    flex-shrink: 0; background: var(--color-off-white);
  }
  .checkin__choice--selected .checkin__choice-key {
    background: var(--color-teal); border-color: var(--color-teal); color: var(--color-white);
  }
  .checkin__textarea {
    width: 100%;
    border: none; border-bottom: 2px solid var(--color-border);
    font-family: 'Roboto Slab', serif; font-size: 20px; font-weight: 400;
    color: var(--color-black);
    padding: 8px 0; margin-bottom: 24px;
    /* Grows with the content via JS. overflow-y: hidden keeps scrollHeight an
       honest measure of the text and stops an inner scrollbar appearing.
       min-height is a whole number of lines so a short answer never sits in a
       box that clips the last line in half. */
    background: transparent; resize: none; line-height: 1.6;
    min-height: 128px; overflow-y: hidden;
    transition: border-color 150ms ease;
  }
  .checkin__textarea:focus { outline: none; border-bottom-color: var(--color-teal); }
  .checkin__textarea::placeholder { color: #97A4A1; }
  .checkin__input {
    width: 100%;
    border: none; border-bottom: 2px solid var(--color-border);
    font-family: 'Roboto Slab', serif; font-size: 22px; font-weight: 400;
    color: var(--color-black);
    padding: 8px 0; margin-bottom: 24px;
    background: transparent;
    transition: border-color 150ms ease;
    color-scheme: dark;
  }
  .checkin__input:focus { outline: none; border-bottom-color: var(--color-teal); }
  .checkin__input::placeholder { color: #97A4A1; }
  .checkin__optional { font-size: 17px; font-weight: 400; color: var(--color-slate); }
  .checkin__actions { display: flex; align-items: center; gap: 12px; }
  .checkin__btn {
    background: var(--color-teal); color: var(--color-white);
    border: none; border-radius: 10px;
    padding: 12px 28px;
    font-family: 'Roboto Slab', serif; font-size: 17px; font-weight: 500;
    cursor: pointer;
    transition: background-color 150ms ease, transform 80ms ease;
  }
  .checkin__btn:hover { background: var(--color-teal-bright); }
  .checkin__btn:active { transform: scale(0.97); }
  .checkin__btn:focus-visible { outline: 2px solid var(--color-black); outline-offset: 2px; }
  .checkin__btn:disabled { opacity: 0.6; cursor: default; }
  .checkin__enter-hint { font-size: 14px; color: var(--color-slate); }
  .checkin__enter-hint strong { font-weight: 600; }
  .checkin__nav {
    position: fixed; bottom: 20px; right: 24px;
    display: flex; gap: 4px; z-index: 10;
  }
  .checkin__nav-btn {
    width: 44px; height: 44px;
    border: 1px solid rgba(92, 214, 200, 0.7);
    background: rgba(92, 214, 200, 0.16); border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--color-teal);
    transition: background-color 150ms ease, color 150ms ease;
  }
  .checkin__nav-btn:hover:not(:disabled) { background: rgba(92, 214, 200, 0.32); color: var(--color-black); }
  .checkin__nav-btn:disabled { opacity: 0.4; cursor: default; }
  .checkin__nav-btn svg { stroke-width: 2.5; }
  @keyframes checkin-nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .checkin__step--nudge { animation: checkin-nudge 220ms ease; }
  .checkin__nav-btn svg { width: 16px; height: 16px; }
  .checkin__welcome-title, .checkin__end-title {
    font-size: 34px; font-weight: 700;
    letter-spacing: -0.005em; line-height: 1.25; margin-bottom: 16px;
  }
  .checkin__welcome-sub, .checkin__end-sub {
    font-size: 18px; color: var(--color-slate);
    line-height: 1.6; margin-bottom: 32px;
  }
  .checkin__welcome-body { margin-bottom: 32px; }
  .checkin__welcome-body p {
    font-size: 17px; color: var(--color-slate);
    line-height: 1.65; margin-bottom: 16px;
  }
  .checkin__welcome-body p:last-child { margin-bottom: 0; }
  .checkin__welcome-body strong { color: var(--color-black); font-weight: 600; }
  .checkin__note {
    display: inline-block;
    background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.45); color: #fbbf24;
    border-radius: 10px; padding: 10px 16px;
    font-size: 15px; margin-bottom: 24px; line-height: 1.55;
  }
  .checkin__error-box {
    background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.45); color: #f87171;
    border-radius: 10px; padding: 14px 18px;
    font-size: 16px; line-height: 1.55; margin-bottom: 24px;
  }
  .checkin__time-estimate {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; color: var(--color-slate); margin-left: 12px;
  }
  .checkin__result { text-align: center; }
  .checkin__result-eyebrow {
    font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-teal); font-weight: 600; margin-bottom: 8px;
  }
  .checkin__gauge { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
  .checkin__result-band {
    font-size: 30px; font-weight: 700; letter-spacing: -0.01em;
    margin: 4px 0 24px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .checkin__result-check {
    width: 34px; height: 34px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .checkin__result-check svg { width: 18px; height: 18px; }
  .checkin__result-msg {
    font-size: 20px; color: var(--color-slate);
    line-height: 1.65; margin: 0 auto 18px; max-width: 560px;
  }
  .checkin__result-msg:first-of-type { color: var(--color-black); font-size: 22px; }
  .checkin__spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(0,0,0,0.35); border-top-color: #000000;
    border-radius: 50%;
    display: inline-block; vertical-align: -4px; margin-right: 8px;
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Shown under a question when its answer cannot be accepted yet, so the
     client is told what to change rather than only seeing the step shake. */
  .checkin__field-error {
    color: #fbbf24; font-size: 16px; line-height: 1.5;
    margin: -12px 0 20px;
  }
  /* Phones and tablets: return makes a new line in a long answer (there is no
     Shift key to hold), and the keyboard hints do not apply. */
  @media (hover: none) and (pointer: coarse) {
    .checkin__enter-hint { display: none; }
  }
  @media (max-width: 640px) {
    .checkin__viewport { padding: 64px 24px 88px; }
    .checkin__question { font-size: 24px; }
    .checkin__welcome-title, .checkin__end-title { font-size: 26px; }
    .checkin__scale { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<div class="checkin__progress"><div class="checkin__progress-fill" id="progressFill"></div></div>
<div class="checkin__brand">MY<span>FIT</span>COACH</div>
<div class="checkin__save-status" id="saveStatus" aria-live="polite"></div>
<div class="checkin__viewport" id="viewport"></div>
<div class="checkin__nav">
  <button class="checkin__nav-btn" id="navUp" title="Previous question" aria-label="Previous question">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l5-5 5 5"/></svg>
  </button>
  <button class="checkin__nav-btn" id="navDown" title="Next question" aria-label="Next question">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l5 5 5-5"/></svg>
  </button>
</div>

<script>
(function () {
  'use strict';

  // URL shapes: /checkin, /monthly, /join - all one shared link per form.
  // Every draft is keyed by a UUID this browser holds in localStorage, since
  // the client is not identified until they type their name at question 1.
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const FORM = pathParts[0];
  const IS_JOIN = FORM === 'join';
  const base = '/api/' + FORM;
  const API = {
    state: base + '/state',
    draft: base + '/draft',
    submit: base + '/submit',
  };

  // Draft key is per form; the remembered name is shared, because the weekly
  // and monthly forms are filled in by the same person on the same device.
  const UUID_KEY = IS_JOIN ? 'mfc_join_uuid' : 'mfc_uuid_' + FORM;
  const NAME_KEY = 'mfc_client_name';

  function readStore(key) {
    try { return localStorage.getItem(key) || null; } catch (e) { return null; }
  }
  function writeStore(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* private mode */ }
  }
  function clearStore(key) {
    try { localStorage.removeItem(key); } catch (e) { /* private mode */ }
  }

  let questions = [];
  let scoring = null;
  let firstName = '';
  let welcomeCopy = null;
  let endCopy = null;
  let doneCopy = null;

  // A phone or tablet with no mouse or trackpad. There, return in a long
  // answer makes a new line, because a phone keyboard has no Shift to hold.
  const TOUCH_ONLY = !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);

  // Same pattern the server checks in routes/onboarding.js.
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  let submittedThisCycle = false;
  let submissionUuid = null;
  const answers = {};
  let currentIndex = 0;
  let submitting = false;

  // ------------------------------------------------------------
  // Autosave - fires after every answer; retries quietly
  // ------------------------------------------------------------
  let saveTimer = null;
  let savePending = false;

  function scheduleSave() {
    savePending = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 400);
  }

  async function flushSave() {
    if (!savePending) return;
    savePending = false;
    try {
      const res = await fetch(API.draft, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: answers, submissionUuid: submissionUuid }),
      });
      if (!res.ok) throw new Error('save failed');
      showSaveStatus('Saved', false);
    } catch (e) {
      savePending = true; // retry on next answer or flush
      showSaveStatus('Offline - answers held on this device', true);
    }
  }

  // Flush pending saves when the client backgrounds the tab / locks phone
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && savePending) {
      navigator.sendBeacon(
        API.draft,
        new Blob([JSON.stringify({ answers: answers, submissionUuid: submissionUuid })], { type: 'application/json' })
      );
      savePending = false;
    }
  });

  let saveStatusTimer = null;
  function showSaveStatus(text, isError) {
    const el = document.getElementById('saveStatus');
    el.textContent = text;
    el.className = 'checkin__save-status checkin__save-status--visible' + (isError ? ' checkin__save-status--error' : '');
    clearTimeout(saveStatusTimer);
    if (!isError) saveStatusTimer = setTimeout(function () { el.classList.remove('checkin__save-status--visible'); }, 1500);
  }

  // ------------------------------------------------------------
  // Flow
  // ------------------------------------------------------------
  // Running weighted total, mirroring computeScore in forms/lib/form-data.js.
  // Needed in the browser because one question appears based on the total
  // rather than on a single answer, and that has to be decided before submit -
  // the server only scores on the way in. Returns null until enough is
  // answered, exactly as the server does, so a part-finished form never
  // triggers a score-based question.
  function currentScore() {
    if (!scoring || !scoring.weightBrackets) return null;
    let total = 0;
    let count = 0;

    Object.keys(scoring.weightBrackets).forEach(function (id) {
      const n = parseInt(answers[id], 10);
      if (Number.isInteger(n) && n >= 1 && n <= 10) {
        total += scoring.weightBrackets[id][n - 1];
        count++;
      }
    });
    const dayW = scoring.daysOnPlanWeights || {};
    if (dayW[answers.days_on_plan] != null) { total += dayW[answers.days_on_plan]; count++; }
    const progW = scoring.progressWeights || {};
    if (progW[answers.progress_direction] != null) { total += progW[answers.progress_direction]; count++; }

    return count < 5 ? null : total;
  }

  function conditionMet(cond, ctx) {
    if (!cond) return true;

    if (Array.isArray(cond.all)) {
      return cond.all.every(function (c) { return conditionMet(c, ctx); });
    }

    // Checked before the field lookup - this condition has no field.
    if (cond.op === 'scoreBelow') {
      const s = ctx && ctx.score;
      return typeof s === 'number' && s < cond.value;
    }

    const v = answers[cond.field];
    if (v == null) return false;
    if (cond.op === 'includes') return Array.isArray(v) && v.indexOf(cond.value) !== -1;
    return cond.op === 'lte' ? v <= cond.value : v >= cond.value;
  }

  function visibleSteps() {
    const ctx = { score: currentScore() };
    const qs = questions.filter(function (q) { return conditionMet(q.conditional, ctx); });
    return [{ kind: 'welcome' }].concat(qs, [{ kind: 'end' }]);
  }

  function firstUnansweredIndex() {
    const visible = visibleSteps();
    for (let i = 1; i < visible.length - 1; i++) {
      const q = visible[i];
      if (q.kind === 'textarea') { if (answers[q.id] == null) return i; }
      else if (answers[q.id] == null) return i;
    }
    return 0;
  }

  /**
   * Pin an outgoing step exactly where it currently sits, before it leaves the
   * layout flow.
   *
   * The active step is position:relative and centred by `margin: auto 0`. The
   * moment the active class comes off it becomes position:absolute with no
   * margins, so it falls back to its static position at the top of the
   * viewport. Measured on a 1280x720 window that is a 200px jump upward: the
   * question you just answered teleported to the top of the screen and faded
   * out from up there while the next one appeared centred. It read as a
   * stutter, and it got worse the taller the window.
   *
   * Copying the live geometry into explicit top/left/width keeps it where the
   * eye last saw it, so the only movement left is the 28px slide the fade is
   * supposed to have.
   */
  function freezeLeavingStep(el) {
    // Read all three before touching any of them - setting one would force a
    // reflow and the next read would come back with the post-change value.
    const top = el.offsetTop;
    const left = el.offsetLeft;
    const width = el.offsetWidth;
    el.style.top = top + 'px';
    el.style.left = left + 'px';
    el.style.width = width + 'px';
  }

  function render() {
    const visible = visibleSteps();
    if (currentIndex >= visible.length) currentIndex = visible.length - 1;
    const step = visible[currentIndex];
    const viewport = document.getElementById('viewport');

    const progress = step.kind === 'end' ? 100 : Math.round((currentIndex / (visible.length - 1)) * 100);
    document.getElementById('progressFill').style.width = progress + '%';

    const el = document.createElement('div');
    el.className = 'checkin__step';
    el.innerHTML = renderStep(step);

    const old = viewport.querySelector('.checkin__step--active');
    if (old) {
      freezeLeavingStep(old);
      old.classList.remove('checkin__step--active');
      old.classList.add('checkin__step--leaving-up');
      setTimeout(function () { old.remove(); }, 320);
    }
    viewport.appendChild(el);
    void el.offsetWidth; // force reflow so the enter transition runs even in hidden tabs
    el.classList.add('checkin__step--active');

    bindStep(el, step);
    updateNav(visible);

    // Put the cursor in the answer box on arrival, for single-line answers as
    // well as long ones. Only long answers used to get it, so on a name, email
    // or number question the client had to click the box before typing.
    const input = el.querySelector('textarea, input.checkin__input');
    if (input) setTimeout(function () { input.focus(); }, 350);
  }

  function renderStep(step) {
    const numberBadge = step.number
      ? '<div class="checkin__question-number">' + step.number +
        ' <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6h8M7 3l3 3-3 3"/></svg></div>'
      : '';

    if (step.kind === 'welcome') {
      const note = submittedThisCycle
        ? '<div class="checkin__note">' + escapeHtml(welcomeCopy.alreadySubmitted) + '</div>'
        : '';
      // On a first visit nobody has named themselves yet, so the greeting is
      // anonymous; once this browser remembers a name it goes back to "Hi X".
      const welcomeTitle = firstName
        ? 'Hi ' + escapeHtml(firstName) + escapeHtml(welcomeCopy.title)
        : escapeHtml(welcomeCopy.titleAnonymous || welcomeCopy.title);
      // Welcome paragraphs come from the server config and may contain
      // <strong> markup - trusted content, not client input.
      return '<div class="checkin__welcome-title">' + welcomeTitle + '</div>' +
        '<div class="checkin__welcome-body">' +
        welcomeCopy.paragraphs.map(function (p) { return '<p>' + p + '</p>'; }).join('') +
        '</div>' +
        note +
        '<div class="checkin__actions">' +
        '<button class="checkin__btn" data-action="next">' + escapeHtml(welcomeCopy.cta) + '</button>' +
        '<span class="checkin__time-estimate">' + escapeHtml(welcomeCopy.time) + '</span>' +
        '</div>';
    }

    if (step.kind === 'end') {
      // Wording comes from the server per form, so onboarding and the monthly
      // report no longer ask the client to "submit check-in".
      const end = endCopy || {};
      return '<div class="checkin__end-title">' + escapeHtml(end.title || 'Ready to send?') + '</div>' +
        '<div class="checkin__end-sub">' + escapeHtml(end.sub || 'Hit submit and your answers come straight through to me.') + '</div>' +
        '<div id="submitError"></div>' +
        '<div class="checkin__actions">' +
        '<button class="checkin__btn" id="submitBtn">' + escapeHtml(end.button || 'Submit') + '</button>' +
        '</div>';
    }

    if (step.kind === 'done') {
      if (!step.endScreen) {
        if (doneCopy) {
          return '<div class="checkin__end-title">' + escapeHtml(doneCopy.title) + '</div>' +
            '<div class="checkin__end-sub">' + escapeHtml(doneCopy.sub) + '</div>';
        }
        // By this point they have named themselves, so prefer what they typed.
        const typedFirst = String(answers.client_name || '').trim().split(/\s+/)[0];
        const thanksName = typedFirst || firstName;
        return '<div class="checkin__end-title">' + (thanksName ? 'Thanks, ' + escapeHtml(thanksName) + '. ' : 'Thanks. ') +
          escapeHtml(receivedLabel()) + '.</div>' +
          '<div class="checkin__end-sub">' + escapeHtml((endCopy && endCopy.thanks) || 'I will review this and come back to you with your feedback.') + '</div>';
      }
      const es = step.endScreen;
      return '<div class="checkin__result">' +
        '<div class="checkin__result-eyebrow">' + escapeHtml(receivedLabel()) + '</div>' +
        gaugeSvg(es.key) +
        '<div class="checkin__result-band">' + escapeHtml(es.label) +
        '<span class="checkin__result-check" style="background:' + escapeHtml(es.color) + '">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>' +
        '</span></div>' +
        es.messages.map(function (m) { return '<p class="checkin__result-msg">' + escapeHtml(m) + '</p>'; }).join('') +
        '</div>';
    }

    if (step.kind === 'textarea') {
      return numberBadge +
        '<div class="checkin__question">' + escapeHtml(step.question) + (step.required === false ? ' <span class="checkin__optional">(optional)</span>' : '') + '</div>' +
        (step.hint ? '<div class="checkin__hint">' + escapeHtml(step.hint) + '</div>' : '') +
        '<textarea class="checkin__textarea" placeholder="Type your answer here..." aria-label="' + escapeHtml(step.question) + '">' +
        escapeHtml(answers[step.id] || '') + '</textarea>' +
        '<div class="checkin__actions">' +
        '<button class="checkin__btn" data-action="next">OK</button>' +
        '<span class="checkin__enter-hint">press <strong>Shift + Enter</strong> for a new line</span>' +
        '</div>';
    }

    // Single-line inputs: text, email, phone, number, date
    if (step.kind === 'text' || step.kind === 'email' || step.kind === 'phone' || step.kind === 'number' || step.kind === 'date') {
      const typeAttr = { text: 'text', email: 'email', phone: 'tel', number: 'number', date: 'date' }[step.kind];
      const inputMode = step.kind === 'number' ? ' inputmode="decimal"' : step.kind === 'phone' ? ' inputmode="tel"' : '';
      const minMax = step.kind === 'number'
        ? (step.min != null ? ' min="' + step.min + '"' : '') + (step.max != null ? ' max="' + step.max + '"' : '')
        : '';
      return numberBadge +
        '<div class="checkin__question">' + escapeHtml(step.question) + '</div>' +
        (step.hint ? '<div class="checkin__hint">' + escapeHtml(step.hint) + '</div>' : '') +
        '<input class="checkin__input" type="' + typeAttr + '"' + inputMode + minMax +
        ' placeholder="Type your answer here..." value="' + escapeHtml(answers[step.id] || '') + '"' +
        ' aria-label="' + escapeHtml(step.question) + '" />' +
        '<div class="checkin__actions">' +
        '<button class="checkin__btn" data-action="next">OK</button>' +
        '<span class="checkin__enter-hint">press <strong>Enter</strong></span>' +
        '</div>';
    }

    if (step.kind === 'scale') {
      let btns = '';
      for (let v = 1; v <= 10; v++) {
        const sel = answers[step.id] === v ? ' checkin__scale-btn--selected' : '';
        btns += '<button class="checkin__scale-btn' + sel + '" data-value="' + v + '">' + v + '</button>';
      }
      const midLabel = step.mid ? '<span class="checkin__scale-label-mid">5 - ' + escapeHtml(step.mid) + '</span>' : '';
      return numberBadge +
        '<div class="checkin__question">' + escapeHtml(step.question) + '</div>' +
        (step.hint ? '<div class="checkin__hint">' + escapeHtml(step.hint) + '</div>' : '') +
        '<div class="checkin__scale">' + btns + '</div>' +
        '<div class="checkin__scale-labels"><span>1 - ' + escapeHtml(step.low) + '</span>' + midLabel + '<span>10 - ' + escapeHtml(step.high) + '</span></div>';
    }

    if (step.kind === 'multichoice') {
      const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const selected = Array.isArray(answers[step.id]) ? answers[step.id] : [];
      let html = '';
      let k = 0;
      for (const section of step.sections) {
        if (section.heading) html += '<div class="checkin__section-heading">' + escapeHtml(section.heading) + '</div>';
        for (const opt of section.options) {
          const sel = selected.indexOf(opt) !== -1 ? ' checkin__choice--selected' : '';
          html += '<button class="checkin__choice' + sel + '" data-value="' + escapeHtml(opt) + '" data-multi="1">' +
            '<span class="checkin__choice-key">' + keys[k++] + '</span>' + escapeHtml(opt) + '</button>';
        }
      }
      if (step.otherOption) {
        const otherSel = selected.indexOf('Other') !== -1;
        html += '<button class="checkin__choice' + (otherSel ? ' checkin__choice--selected' : '') + '" data-value="Other" data-multi="1">' +
          '<span class="checkin__choice-key">' + keys[k++] + '</span>Other</button>';
        html += '<input class="checkin__other-input" id="otherInput" type="text" placeholder="Tell me what you need..." ' +
          'style="display:' + (otherSel ? 'block' : 'none') + '" value="' + escapeHtml(answers[step.id + '_other'] || '') + '" ' +
          'aria-label="Other - tell me what you need" />';
      }
      return numberBadge +
        '<div class="checkin__question">' + escapeHtml(step.question) + '</div>' +
        (step.hint ? '<div class="checkin__hint">' + escapeHtml(step.hint) + '</div>' : '') +
        '<div class="checkin__choices checkin__choices--multi">' + html + '</div>' +
        '<div class="checkin__actions">' +
        '<button class="checkin__btn" data-action="next">OK</button>' +
        '</div>';
    }

    if (step.kind === 'choice') {
      const keys = 'ABCDEFG';
      let opts = '';
      step.options.forEach(function (opt, i) {
        const sel = answers[step.id] === opt ? ' checkin__choice--selected' : '';
        opts += '<button class="checkin__choice' + sel + '" data-value="' + escapeHtml(opt) + '">' +
          '<span class="checkin__choice-key">' + keys[i] + '</span>' + escapeHtml(opt) + '</button>';
      });
      return numberBadge +
        '<div class="checkin__question">' + escapeHtml(step.question) + '</div>' +
        (step.hint ? '<div class="checkin__hint">' + escapeHtml(step.hint) + '</div>' : '') +
        '<div class="checkin__choices">' + opts + '</div>';
    }
    return '';
  }

  function bindStep(el, step) {
    // A "why can't I continue" message goes as soon as the client changes
    // their answer, so it never sits there describing an answer they fixed.
    el.addEventListener('input', function () { clearFieldError(el); });
    el.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.checkin__choice, .checkin__scale-btn')) clearFieldError(el);
    });

    el.querySelectorAll('[data-action="next"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const field = el.querySelector('textarea, input.checkin__input');
        if (field) { answers[step.id] = field.value; scheduleSave(); }
        tryAdvance();
      });
    });

    // Enter is handled once, for every kind of step, in the document keydown
    // listener below - not per field.
    const input = el.querySelector('input.checkin__input');
    if (input) {
      input.addEventListener('input', function () {
        answers[step.id] = input.value;
        scheduleSave();
      });
    }

    el.querySelectorAll('.checkin__scale-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        answers[step.id] = parseInt(btn.dataset.value, 10);
        scheduleSave();
        btn.classList.add('checkin__scale-btn--selected');
        advanceShortly();
      });
    });

    el.querySelectorAll('.checkin__choice').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.multi) {
          // Multi-select: toggle, never auto-advance
          const arr = Array.isArray(answers[step.id]) ? answers[step.id].slice() : [];
          const v = btn.dataset.value;
          const idx = arr.indexOf(v);
          if (idx === -1) arr.push(v); else arr.splice(idx, 1);
          answers[step.id] = arr;
          btn.classList.toggle('checkin__choice--selected', idx === -1);
          if (v === 'Other') {
            const inp = el.querySelector('#otherInput');
            if (inp) {
              inp.style.display = idx === -1 ? 'block' : 'none';
              if (idx === -1) inp.focus();
            }
          }
          scheduleSave();
          return;
        }
        answers[step.id] = btn.dataset.value;
        scheduleSave();
        btn.classList.add('checkin__choice--selected');
        advanceShortly();
      });
    });

    const otherInput = el.querySelector('#otherInput');
    if (otherInput) {
      otherInput.addEventListener('input', function () {
        answers[step.id + '_other'] = otherInput.value;
        scheduleSave();
      });
    }

    const ta = el.querySelector('textarea');
    if (ta) {
      // Grow to fit what has been written. The box was a fixed 96px, so a long
      // answer was clipped mid-line and the client could not read back what
      // they had typed without scrolling inside the box. bindStep runs after
      // the step is in the DOM, so measuring here is safe, and calling it once
      // now sizes a restored draft correctly on arrival.
      const autoGrow = function () {
        ta.style.height = 'auto';
        // box-sizing is border-box, so height must include the 2px bottom
        // border or the last line is clipped by exactly that much.
        const border = ta.offsetHeight - ta.clientHeight;
        ta.style.height = (ta.scrollHeight + border) + 'px';
      };
      ta.addEventListener('input', autoGrow);
      autoGrow();
    }

    const submitBtn = el.querySelector('#submitBtn');
    if (submitBtn) submitBtn.addEventListener('click', doSubmit);
  }

  // ------------------------------------------------------------
  // Submit - confirmed by the server before the thank-you screen,
  // retried automatically, idempotent via submissionUuid
  // ------------------------------------------------------------
  async function doSubmit() {
    if (submitting) return;
    submitting = true;
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('submitError');
    btn.disabled = true;
    btn.innerHTML = '<span class="checkin__spinner"></span>Sending - do not close';
    errBox.innerHTML = '';

    clearTimeout(saveTimer);

    let lastError = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const res = await fetch(API.submit, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: answers, submissionUuid: submissionUuid }),
        });
        const body = await res.json().catch(function () { return {}; });

        if (res.ok && body.ok) {
          showDone(body.endScreen || null);
          return;
        }
        if (res.status === 422) {
          // The server names the questions it could not accept. Go to the
          // first of those and say what is wrong there. This used to guess
          // "the first unanswered question", which is nowhere when the problem
          // is an answer that is filled in but invalid, and dropped the client
          // on the welcome screen.
          errBox.innerHTML = '<div class="checkin__error-box">One of your answers needs another look - taking you to it now.</div>';
          submitting = false;
          const missing = Array.isArray(body.missing) ? body.missing : [];
          setTimeout(function () {
            const visible = visibleSteps();
            let idx = visible.findIndex(function (s) { return s.id && missing.indexOf(s.id) !== -1; });
            if (idx === -1) idx = firstUnansweredIndex();
            currentIndex = idx;
            render();
            const target = visible[idx];
            showFieldError(answerProblem(target) || 'Please check this answer.');
          }, 1600);
          return;
        }
        lastError = body.error || ('HTTP ' + res.status);
      } catch (e) {
        lastError = 'network';
      }
      await new Promise(function (r) { setTimeout(r, attempt * 1200); });
    }

    submitting = false;
    btn.disabled = false;
    btn.textContent = 'Try again';
    errBox.innerHTML = '<div class="checkin__error-box">Could not send just now (' + escapeHtml(String(lastError)) + '). ' +
      'Your answers are saved - nothing is lost. Check your connection and try again.</div>';
  }

  function showDone(endScreen) {
    const viewport = document.getElementById('viewport');
    document.getElementById('progressFill').style.width = '100%';
    const el = document.createElement('div');
    el.className = 'checkin__step';
    el.innerHTML = renderStep({ kind: 'done', endScreen: endScreen });
    const old = viewport.querySelector('.checkin__step--active');
    if (old) {
      freezeLeavingStep(old);
      old.classList.remove('checkin__step--active');
      old.classList.add('checkin__step--leaving-up');
      setTimeout(function () { old.remove(); }, 320);
    }
    viewport.appendChild(el);
    void el.offsetWidth; // force reflow so the enter transition runs even in hidden tabs
    el.classList.add('checkin__step--active');
    finished = true;
    document.querySelector('.checkin__nav').style.display = 'none';
    // Fresh UUID so the next cycle (or the next person onboarding on this
    // device) starts a clean draft rather than resuming this one.
    clearStore(UUID_KEY);
    // Remember the name so next week's check-in comes prefilled.
    if (!IS_JOIN) {
      const submittedName = String(answers.client_name || '').trim();
      if (submittedName) writeStore(NAME_KEY, submittedName);
    }
  }

  let finished = false;

  function goNext() {
    if (finished) return;
    const visible = visibleSteps();
    if (currentIndex < visible.length - 1) { currentIndex++; render(); }
  }
  /**
   * Move on after a short pause, so the client sees their answer highlight.
   * The pause is tied to the question it was started from: if anything has
   * already moved the form on (Enter, a second tap, the arrows), it does
   * nothing. A plain delayed goNext() used to fire once per tap, so a
   * double-tap on an answer skipped the following question entirely.
   */
  function advanceShortly() {
    const from = currentIndex;
    setTimeout(function () { if (currentIndex === from) goNext(); }, 220);
  }
  function goBack() {
    if (finished || submitting) return;
    if (currentIndex > 0) { currentIndex--; render(); }
  }

  /**
   * What is stopping this question's answer being accepted, as a sentence
   * for the client - or null if it is fine.
   *
   * Mirrors the server's checks (routes/onboarding.js validateOnboarding and
   * lib/form-data.js validateAnswers). Before this the browser only checked
   * that something had been typed, so a mistyped email, or a height given in
   * feet, sailed through every question and was rejected at Submit. The
   * client was then sent back to the welcome screen told an answer was
   * "missing", with no way to find out which or why, and could never finish.
   */
  function answerProblem(step) {
    if (!step || step.kind === 'welcome' || step.kind === 'end') return null;
    const v = answers[step.id];
    const empty = v == null || (Array.isArray(v) ? v.length === 0 : String(v).trim() === '');

    if (step.kind === 'scale') return empty ? 'Pick a number to continue.' : null;
    if (step.kind === 'choice') return empty ? 'Pick an answer to continue.' : null;

    // A number box holds nothing at all when what was typed is not a number
    // ("5'11", "13st"), so for numbers an empty box gets the same guidance as
    // a wrong one: say what we need, not just that it is blank.
    if (step.kind === 'number') {
      const n = parseFloat(v);
      const bad = empty || !isFinite(n) ||
        (step.min != null && n < step.min) || (step.max != null && n > step.max);
      if (empty && !step.required) return null;
      if (!bad) return null;
      return step.invalidMessage ||
        ('Please enter a number' + (step.min != null && step.max != null ? ' between ' + step.min + ' and ' + step.max : '') + '.');
    }

    if (empty) {
      if (!step.required) return null;
      return step.kind === 'multichoice' ? 'Pick at least one to continue.' : 'Please answer this one to continue.';
    }
    if (step.kind === 'email' && !EMAIL_RE.test(String(v).trim())) {
      return "That email address doesn't look right. Check it for typos.";
    }
    if (step.kind === 'date' && (!DATE_RE.test(String(v)) || isNaN(new Date(v).getTime()))) {
      return 'Please enter the full date.';
    }
    return null;
  }

  /** Can the client leave this step going forward? */
  function canAdvance(step) {
    if (!step) return false;
    if (step.kind === 'welcome') return true;
    if (step.kind === 'end') return false;
    return answerProblem(step) === null;
  }

  function showFieldError(message) {
    const el = document.querySelector('.checkin__step--active');
    if (!el) return;
    let box = el.querySelector('.checkin__field-error');
    if (!box) {
      box = document.createElement('div');
      box.className = 'checkin__field-error';
      box.setAttribute('role', 'alert');
      const actions = el.querySelector('.checkin__actions');
      if (actions) el.insertBefore(box, actions); else el.appendChild(box);
    }
    box.textContent = message;
  }

  function clearFieldError(el) {
    const box = el && el.querySelector('.checkin__field-error');
    if (box) box.remove();
  }

  function receivedLabel() {
    return (endCopy && endCopy.received) || 'Received';
  }

  /** Save any in-progress text on the active step before navigating away. */
  function captureActiveText() {
    const step = visibleSteps()[currentIndex];
    if (!step) return;
    const field = document.querySelector('.checkin__step--active textarea, .checkin__step--active input.checkin__input');
    if (field && step.kind !== 'multichoice') { answers[step.id] = field.value; scheduleSave(); }
  }

  function tryAdvance() {
    if (finished || submitting) return;
    const step = visibleSteps()[currentIndex];
    captureActiveText();
    if (canAdvance(step)) { goNext(); return; }
    // Blocked - say why, and give a little shake so it is noticed
    const problem = answerProblem(step);
    if (problem) showFieldError(problem);
    const el = document.querySelector('.checkin__step--active');
    if (el) {
      el.classList.remove('checkin__step--nudge');
      void el.offsetWidth;
      el.classList.add('checkin__step--nudge');
    }
  }
  function updateNav(visible) {
    document.getElementById('navUp').disabled = currentIndex === 0;
    document.getElementById('navDown').disabled = currentIndex >= visible.length - 1;
  }

  document.getElementById('navUp').addEventListener('click', goBack);
  document.getElementById('navDown').addEventListener('click', tryAdvance);

  document.addEventListener('keydown', function (e) {
    if (submitting || finished) return;
    if (!welcomeCopy) return; // the form never loaded - only the error screen is showing
    const visible = visibleSteps();
    const step = visible[currentIndex];

    // Enter means "OK, next" on every step, whatever kind of question it is and
    // wherever the focus happens to be. It used to be wired separately into
    // each text box, so it only worked after tapping into one, did nothing on
    // scale, choice and multi-select questions, and on long answers skipped
    // the required-answer check the OK button applies.
    if (e.key === 'Enter') {
      if (e.isComposing || e.keyCode === 229) return; // mid-word in a predictive / IME keyboard
      const inLongAnswer = e.target && e.target.tagName === 'TEXTAREA';
      if (inLongAnswer && e.shiftKey) return; // Shift + Enter = new line
      // Phones have no Shift key, so return in a long answer is always a new
      // line there; the client taps OK to move on.
      if (inLongAnswer && TOUCH_ONLY) return;
      // Two places where Enter should keep doing what the focused button does:
      // the submit screen (never submit a check-in just because Enter was held)
      // and the "previous question" arrow.
      if (step.kind === 'end') return;
      if (e.target && e.target.id === 'navUp') return;
      // Stops a focused answer button being "clicked" by Enter - on a
      // multi-select that silently un-ticked the option instead of moving on.
      e.preventDefault();
      if (e.repeat) return; // a held-down Enter must not race through questions
      tryAdvance();
      return;
    }

    // Arrow keys navigate, Typeform-style (up = back, down = forward if
    // allowed) - but not while typing in a box, where up and down move the
    // cursor between lines (or change a date or number). They used to jump to
    // another question mid-sentence in a long answer.
    const typing = e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT');
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !typing) {
      e.preventDefault();
      if (e.key === 'ArrowUp') goBack(); else tryAdvance();
      return;
    }
    // Letter and number shortcuts must not fire on Cmd/Ctrl/Alt combinations -
    // Cmd+C on a multiple-choice question used to pick answer C.
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (step.kind === 'scale' && /^[0-9]$/.test(e.key)) {
      const v = e.key === '0' ? 10 : parseInt(e.key, 10);
      answers[step.id] = v;
      scheduleSave();
      render();
      advanceShortly();
    }
    if (step.kind === 'choice' && /^[a-gA-G]$/.test(e.key)) {
      const idx = e.key.toUpperCase().charCodeAt(0) - 65;
      if (step.options[idx]) {
        answers[step.id] = step.options[idx];
        scheduleSave();
        render();
        advanceShortly();
      }
    }
    if (step.kind === 'multichoice' && /^[a-zA-Z]$/.test(e.key) && !e.metaKey && !e.ctrlKey) {
      // Don't hijack letters while typing in the Other box
      if (document.activeElement && document.activeElement.id === 'otherInput') return;
      const flat = step.sections.flatMap(function (s) { return s.options; });
      if (step.otherOption) flat.push('Other');
      const idx = e.key.toUpperCase().charCodeAt(0) - 65;
      if (flat[idx] != null) {
        const btns = document.querySelectorAll('.checkin__step--active .checkin__choice[data-multi]');
        for (let i = 0; i < btns.length; i++) {
          if (btns[i].dataset.value === flat[idx]) { btns[i].click(); break; }
        }
      }
    }
  });

  // Swipe navigation on touch devices: swipe up = next question (if allowed),
  // swipe down = previous. Ignored on scrollable/typing areas so the multi-
  // select list still scrolls and textareas still behave normally.
  let touchStartY = null;
  let touchStartX = null;
  document.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (touchStartY == null) return;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartY = touchStartX = null;
    if (submitting || finished) return;
    if (e.target && e.target.closest && e.target.closest('.checkin__choices--multi, textarea, input')) return;
    if (Math.abs(dy) < 70 || Math.abs(dy) < Math.abs(dx) * 1.5) return;
    if (dy < 0) tryAdvance(); else goBack();
  }, { passive: true });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ------------------------------------------------------------
  // Score gauge (end screen) - drawn as SVG, needle on the active band
  // ------------------------------------------------------------
  var GAUGE_BANDS = [
    { key: 'critical', label: 'Critical', color: '#e53935' },
    { key: 'under', label: 'Underperforming', color: '#f57c00' },
    { key: 'stable', label: 'Stable', color: '#fdd835' },
    { key: 'high', label: 'High Performance', color: '#8bc34a' },
    { key: 'peak', label: 'Peak Performance', color: '#43a047' },
  ];

  function gaugeSvg(activeKey) {
    const cx = 350, cy = 300, rOut = 190, rIn = 104;
    function pt(angleDeg, r) {
      const a = (Math.PI * angleDeg) / 180;
      return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy - r * Math.sin(a)).toFixed(1);
    }
    let svg = '<svg class="checkin__gauge" viewBox="0 30 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Score gauge">';

    GAUGE_BANDS.forEach(function (band, i) {
      const a1 = 180 - i * 36;
      const a2 = 180 - (i + 1) * 36;
      svg += '<path d="M ' + pt(a1, rOut) + ' A ' + rOut + ' ' + rOut + ' 0 0 1 ' + pt(a2, rOut) +
        ' L ' + pt(a2, rIn) + ' A ' + rIn + ' ' + rIn + ' 0 0 0 ' + pt(a1, rIn) + ' Z" ' +
        'fill="' + band.color + '" stroke="#000000" stroke-width="4"/>';

      // Tick + label at the segment centre (skip the active band - it gets the big title below)
      if (band.key !== activeKey) {
        const mid = 180 - (i * 36 + 18);
        svg += '<line x1="' + pt(mid, rOut + 4).replace(' ', '" y1="') + '" x2="' + pt(mid, rOut + 20).replace(' ', '" y2="') + '" stroke="' + band.color + '" stroke-width="5"/>';
        const rad = (Math.PI * mid) / 180;
        const lx = cx + (rOut + 30) * Math.cos(rad);
        const ly = cy - (rOut + 30) * Math.sin(rad);
        const anchor = mid > 105 ? 'end' : mid < 75 ? 'start' : 'middle';
        const words = band.label.split(' ');
        svg += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '" fill="#ffffff" font-family="Roboto Slab, serif" font-size="22" font-weight="600">';
        if (words.length === 1 || anchor === 'middle') {
          svg += escapeHtml(band.label);
        } else {
          svg += '<tspan x="' + lx.toFixed(1) + '" dy="0">' + escapeHtml(words[0]) + '</tspan>' +
            '<tspan x="' + lx.toFixed(1) + '" dy="26">' + escapeHtml(words.slice(1).join(' ')) + '</tspan>';
        }
        svg += '</text>';
      }
    });

    // Needle pointing at the active band
    const activeIdx = GAUGE_BANDS.findIndex(function (b) { return b.key === activeKey; });
    const needleAngle = 180 - (Math.max(activeIdx, 0) * 36 + 18);
    const nRad = (Math.PI * needleAngle) / 180;
    const tipX = cx + (rOut - 28) * Math.cos(nRad);
    const tipY = cy - (rOut - 28) * Math.sin(nRad);
    const b1x = cx + 10 * Math.cos(nRad + Math.PI / 2);
    const b1y = cy - 10 * Math.sin(nRad + Math.PI / 2);
    const b2x = cx + 10 * Math.cos(nRad - Math.PI / 2);
    const b2y = cy - 10 * Math.sin(nRad - Math.PI / 2);
    svg += '<path d="M ' + tipX.toFixed(1) + ' ' + tipY.toFixed(1) + ' L ' + b1x.toFixed(1) + ' ' + b1y.toFixed(1) +
      ' L ' + b2x.toFixed(1) + ' ' + b2y.toFixed(1) + ' Z" fill="#ffffff"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="24" fill="#ffffff"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="11" fill="#000000"/>';
    svg += '</svg>';
    return svg;
  }

  // ------------------------------------------------------------
  // Boot - load state, resume any draft
  // ------------------------------------------------------------
  function newUuid() {
    return (crypto.randomUUID && crypto.randomUUID()) ||
      'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        const r = (Math.random() * 16) | 0;
        return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
      });
  }

  async function boot() {
    try {
      // The draft key lives in this browser for every form now.
      submissionUuid = readStore(UUID_KEY);
      const params = [];
      if (submissionUuid) params.push('uuid=' + encodeURIComponent(submissionUuid));
      // Send the name this browser remembered so the server can greet them and
      // tell them if they have already submitted this cycle. Not used by /join.
      const remembered = IS_JOIN ? null : readStore(NAME_KEY);
      if (remembered) params.push('name=' + encodeURIComponent(remembered));
      const stateUrl = API.state + (params.length ? '?' + params.join('&') : '');

      const res = await fetch(stateUrl);
      if (!res.ok) throw new Error('state ' + res.status);
      const state = await res.json();
      if (!state.ok) throw new Error(state.error);

      questions = state.questions;
      scoring = state.scoring || null;
      firstName = state.firstName;
      welcomeCopy = state.welcome;
      endCopy = state.end || null;
      doneCopy = state.done || null;
      submittedThisCycle = state.submittedThisCycle;
      if (state.formTitle) document.title = state.formTitle + ' - MyFitCoach';

      if (state.draft) {
        Object.assign(answers, state.draft.answers || {});
        submissionUuid = state.draft.submissionUuid;
      }
      if (!submissionUuid) submissionUuid = newUuid();
      writeStore(UUID_KEY, submissionUuid);

      // Prefill the name question from what this browser remembers, so a
      // returning client just presses Enter. Deliberately prefilled and not
      // skipped: a shared device would otherwise silently file someone's
      // check-in under the wrong person.
      if (!IS_JOIN && !answers.client_name && state.rememberedName) {
        answers.client_name = state.rememberedName;
      }

      currentIndex = 0;
      render();
    } catch (e) {
      document.getElementById('viewport').innerHTML =
        '<div class="checkin__step checkin__step--active">' +
        '<div class="checkin__end-title">Something went wrong loading your check-in</div>' +
        '<div class="checkin__end-sub">Give it a second and refresh the page. If it keeps happening, message Connor directly.</div>' +
        '<div class="checkin__actions"><button class="checkin__btn" onclick="window.location.reload()">Refresh</button></div>' +
        '</div>';
    }
  }

  boot();
})();
</script>
</body>
</html>
